[workspace]
members = ["crates/occurrence-consumer"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
oxc_allocator = "0.144.0"
oxc_ast = "0.144.0"
oxc_parser = "0.144.0"
oxc_semantic = "0.144.0"
oxc_span = "0.144.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
